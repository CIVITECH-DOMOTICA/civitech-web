<div class="banner-container">
  <!-- Optimized Image Background (Priority HTML Load) -->
  <img *ngIf="!videoUrl" [src]="imageUrl" alt="Instalación de domótica en Zaragoza - Civitec Domótica" class="banner-img"
    fetchpriority="high" loading="eager">

  <!-- Video Background -->
  <video *ngIf="videoUrl" [src]="videoUrl" autoplay [muted]="true" loop playsinline class="banner-video"
    oncanplay="this.play()" onloadedmetadata="this.muted = true"></video>

  <div class="overlay"></div>
  <div class="banner-content" data-aos="fade-right" data-aos-duration="1200">
    <div class="mensaje-container">
      <div class="mensaje-items">
        <h1 *ngIf="isH1" class="banner-heading" data-aos="fade-up" data-aos-delay="200">{{mensaje}}</h1>
        <h2 *ngIf="!isH1" class="banner-heading" data-aos="fade-up" data-aos-delay="200">{{mensaje}}</h2>
        <div class="banner-cta-group">
          <button class="boton-proyectos" (click)="navigate()" data-aos="fade-up"
            data-aos-delay="400">{{textoBoton}}</button>
          <button *ngIf="whatsappTexto" class="boton-whatsapp" (click)="openWhatsApp()" data-aos="fade-up"
            data-aos-delay="500" aria-label="Pedir presupuesto por WhatsApp">
            <i class="fab fa-whatsapp"></i> {{whatsappTexto}}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
